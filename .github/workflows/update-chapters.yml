name: Update Manga Chapters

# Rafraîchit les chapitres de toutes les séries suivies, depuis les 6 scrapers.
#
# ⚠️ Ce workflow DOIT tourner sur un dépôt PUBLIC : ~11 min par exécution réelle
# × 12/jour ≈ 3 400 min/mois (+ ~35 déclenchements/jour sans travail à faire, ~30 s
# chacun), contre 2 000 min/mois gratuites sur un dépôt privé. C'est la raison
# d'être de ce dépôt, séparé de l'application. Cf. README.md.
#
# ⚠️ GitHub désactive les workflows planifiés après 60 jours SANS ACTIVITÉ sur le
# dépôt. Si le cron s'arrête sans erreur, vérifier d'abord l'onglet Actions : un
# simple commit (ou le bouton « Enable workflow ») le relance.
on:
  schedule:
    # ⚠️ Toutes les 30 min, et ce n'est PAS la cadence de rafraîchissement : le
    # script ne met à jour qu'au-delà de 2 h d'ancienneté (`UPDATE_INTERVAL_HOURS`),
    # donc un déclenchement en trop ne touche rien et coûte ~30 s.
    #
    # Pourquoi : mesuré le 2026-08-30 sur les 8 premiers runs, avec `0 */2 * * *`,
    # AUCUN n'est parti à l'heure pile (:28, :17, :50, :05, :39, :37) et les écarts
    # réels allaient de 1,98 h à 6,57 h. L'événement `schedule` de GitHub est
    # best-effort : déprioritisé sous charge, des déclenchements sont purement
    # abandonnés — surtout à `:00`, la minute la plus demandée. Déclencher souvent
    # est le seul moyen fiable d'obtenir un passage proche des 2 h voulues.
    #
    # ⚠️ Autre effet corrigé au passage : la fenêtre des 2 h se compte depuis la FIN
    # de la mise à jour précédente. Un run durant ~11 min, un déclenchement
    # parfaitement ponctuel toutes les 2 h trouvait la queue du catalogue à 1 h 49
    # et ne faisait rien.
    - cron: '*/30 * * * *'

  # Permet aussi de lancer manuellement depuis GitHub
  workflow_dispatch:

# Deux runs ne doivent JAMAIS scraper en même temps : sources amont tapées en
# double et écritures concurrentes sur les mêmes séries. Indispensable dès lors
# qu'on déclenche toutes les 30 min pour des runs de ~11 min. Un déclenchement
# arrivant pendant un run est mis en attente ; `cancel-in-progress: false` protège
# le run en cours plutôt que de l'interrompre en plein scraping.
concurrency:
  group: update-chapters
  cancel-in-progress: false

jobs:
  update-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔐 Verify environment variables
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "❌ Error: NEXT_PUBLIC_SUPABASE_URL is not set"
            echo "Please add NEXT_PUBLIC_SUPABASE_URL to GitHub Secrets"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "❌ Error: NEXT_PUBLIC_SUPABASE_ANON_KEY is not set"
            echo "Please add NEXT_PUBLIC_SUPABASE_ANON_KEY to GitHub Secrets"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ Error: SUPABASE_SERVICE_ROLE_KEY is not set"
            echo "Please add SUPABASE_SERVICE_ROLE_KEY to GitHub Secrets"
            exit 1
          fi
          echo "✅ Environment variables are set"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 🔄 Run chapter update script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Starting chapter update job..."
          npm run cron:update-chapters

      - name: 📊 Summary
        if: always()
        run: |
          echo "### 📚 Chapter Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: Update Manga Chapters" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
