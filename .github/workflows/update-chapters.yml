name: Update Manga Chapters

# Rafraîchit les chapitres de toutes les séries suivies, depuis les 6 scrapers.
#
# ⚠️ Ce workflow DOIT tourner sur un dépôt PUBLIC : ~11 min par exécution réelle
# × 12/jour ≈ 3 400 min/mois (+ ~60 déclenchements/jour sans travail à faire, ~30 s
# chacun), contre 2 000 min/mois gratuites sur un dépôt privé. C'est la raison
# d'être de ce dépôt, séparé de l'application. Cf. README.md.
#
# ⚠️ GitHub désactive les workflows planifiés après 60 jours SANS ACTIVITÉ sur le
# dépôt. Si le cron s'arrête sans erreur, vérifier d'abord l'onglet Actions : un
# simple commit (ou le bouton « Enable workflow ») le relance.
on:
  # ⚠️ Le déclencheur PRINCIPAL n'est plus ici : depuis le 2026-08-31, c'est un job
  # cron-job.org qui appelle `workflow_dispatch` via l'API GitHub toutes les 30 min
  # (un dispatch API part quasi immédiatement, contrairement à `schedule`).
  # Le PAT utilisé (fine-grained, ce dépôt seul, permission Actions read/write) est
  # stocké chez cron-job.org — s'il expire, le job passe en 401 puis est désactivé
  # automatiquement (email envoyé), et seul le fallback ci-dessous tourne encore.
  #
  # Le `schedule` ci-dessous n'est qu'un FILET DE SECOURS (PAT expiré, job
  # cron-job.org désactivé, service down) : cadence horaire, à :07 car `:00` est
  # la minute la plus demandée et la plus abandonnée par le scheduler GitHub.
  #
  # Pourquoi `schedule` seul ne suffisait pas : mesuré le 2026-08-30 sur les
  # 8 premiers runs avec `0 */2 * * *`, AUCUN n'est parti à l'heure pile et les
  # écarts réels allaient de 1,98 h à 6,57 h. L'événement est best-effort :
  # déprioritisé sous charge, des déclenchements sont purement abandonnés.
  #
  # ⚠️ Ni la cadence cron-job.org ni celle-ci ne sont la cadence de
  # rafraîchissement : le script ne met à jour qu'au-delà de 2 h d'ancienneté
  # (`UPDATE_INTERVAL_HOURS`), comptées depuis la FIN du run précédent — un
  # déclenchement en trop ne touche rien et coûte ~30 s.
  schedule:
    - cron: '7 * * * *'

  # Permet aussi de lancer manuellement depuis GitHub — et d'essayer une autre
  # concurrence SANS commit et sans toucher au planifié : sur `schedule` l'input
  # n'existe pas, la variable vaut "" et `Number("") || 4` retombe sur le défaut.
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Séries traitées en parallèle (vide = 8)'
        required: false
        default: ''
      source_concurrency:
        description: 'Requêtes concurrentes par source (vide = 4, 0 = sans limite)'
        required: false
        default: ''

# Deux runs ne doivent JAMAIS scraper en même temps : sources amont tapées en
# double et écritures concurrentes sur les mêmes séries. Indispensable dès lors
# qu'on déclenche toutes les 30 min pour des runs de ~11 min. Un déclenchement
# arrivant pendant un run est mis en attente ; `cancel-in-progress: false` protège
# le run en cours plutôt que de l'interrompre en plein scraping.
concurrency:
  group: update-chapters
  cancel-in-progress: false

jobs:
  update-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔐 Verify environment variables
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "❌ Error: NEXT_PUBLIC_SUPABASE_URL is not set"
            echo "Please add NEXT_PUBLIC_SUPABASE_URL to GitHub Secrets"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "❌ Error: NEXT_PUBLIC_SUPABASE_ANON_KEY is not set"
            echo "Please add NEXT_PUBLIC_SUPABASE_ANON_KEY to GitHub Secrets"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ Error: SUPABASE_SERVICE_ROLE_KEY is not set"
            echo "Please add SUPABASE_SERVICE_ROLE_KEY to GitHub Secrets"
            exit 1
          fi
          echo "✅ Environment variables are set"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 🔄 Run chapter update script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_CONCURRENCY: ${{ github.event.inputs.concurrency }}
          CRON_SOURCE_CONCURRENCY: ${{ github.event.inputs.source_concurrency }}
        run: |
          echo "🚀 Starting chapter update job..."
          npm run cron:update-chapters

      - name: 📊 Summary
        if: always()
        run: |
          echo "### 📚 Chapter Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: Update Manga Chapters" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
